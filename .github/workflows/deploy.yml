name: Deploy to Production

on:
  push:
    branches: [main]
    workflow_dispatch: # allow manual deployment
jobs:
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Rsync files to server
        run: |
          rsync -avz \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            ./ ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:${{ secrets.DEPLOY_LOCATION }}

      - name: Deploy application to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            nvm use 26
            cd ${{ secrets.DEPLOY_LOCATION }}
            npm ci
            npm run astro build
            # Reload the running service so the freshly built dist/ is served.
            # Uses passwordless sudo (restricted to this unit via sudoers drop-in
            # /etc/sudoers.d/enchanter-deploy). Fail the job if sudo or restart fails.
            sudo systemctl restart ${{ secrets.SYSTEMD_SERVICE_NAME }}
            journalctl -u ${{ secrets.SYSTEMD_SERVICE_NAME }} --no-pager -n 30 --since "1 min ago" || true

      - name: Cleanup SSH
        if: always()
        run: rm -f ~/.ssh/deploy_key
